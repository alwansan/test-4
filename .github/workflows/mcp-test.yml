name: MCP Quick Test

on:
  push:
    branches: ["mcp-capability-audit"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment
        required: false
        default: "staging"

jobs:
  quick-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Say hello
        run: echo "MCP dispatch run OK at $(date) — env=${{ inputs.environment }}"
      - name: Check files
        run: |
          ls -la
          test -f MCP_CAPABILITY_AUDIT.md && echo "Audit file present"
