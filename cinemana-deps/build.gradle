tasks.register('resolveAll') {
    doLast {
        configurations.findAll { it.canBeResolved }.each { cfg ->
            println "RESOLVING " + cfg.name
            def files = cfg.resolve()
            println "RESOLVED " + cfg.name + " -> " + files.size() + " files"
        }
    }
}
