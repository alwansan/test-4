name: Cinemana CP442 dependency cache

on:
  push:
    branches:
      - cinemana-cp442-dependency-cache
    paths:
      - 'cinemana-deps/**'
      - '.github/workflows/cinemana-cp442-deps.yml'

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Resolve complete dependency graph
        id: deps
        continue-on-error: true
        working-directory: cinemana-deps
        shell: bash
        run: |
          set -o pipefail
          gradle --version
          gradle --no-daemon --stacktrace resolveAll 2>&1 | tee "$GITHUB_WORKSPACE/resolve.log"

      - name: Package Gradle dependency cache
        if: always()
        shell: bash
        run: |
          set -eux
          if [ -d "$HOME/.gradle/caches/modules-2" ]; then
            tar -C "$HOME/.gradle/caches" -czf "$GITHUB_WORKSPACE/gradle-modules2-cp442.tgz" modules-2
          else
            tar -czf "$GITHUB_WORKSPACE/gradle-modules2-cp442.tgz" --files-from /dev/null
          fi

      - name: Upload dependency cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinemana-cp442-gradle-modules2
          path: |
            gradle-modules2-cp442.tgz
            resolve.log
          compression-level: 0
          retention-days: 3

      - name: Propagate dependency resolution failure
        if: steps.deps.outcome == 'failure'
        run: exit 1
