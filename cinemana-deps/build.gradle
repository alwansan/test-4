repositories {
    google()
    mavenCentral()
    maven { url 'https://zendesk.jfrog.io/zendesk/repo' }
    maven { url 'https://jitpack.io' }
}

configurations {
    buildPlugins
    appDeps
    processors {
        attributes {
            attribute(org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE,
                objects.named(org.gradle.api.attributes.Usage, org.gradle.api.attributes.Usage.JAVA_RUNTIME))
            attribute(org.gradle.api.attributes.Category.CATEGORY_ATTRIBUTE,
                objects.named(org.gradle.api.attributes.Category, org.gradle.api.attributes.Category.LIBRARY))
            attribute(org.gradle.api.attributes.LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE,
                objects.named(org.gradle.api.attributes.LibraryElements, org.gradle.api.attributes.LibraryElements.JAR))
        }
    }
}

